name: Release — crates.io · npm · pub.dev

# Triggered by an explicit semver tag pushed to the repository.
# Workflow: verify → build artefacts (parallel) → assemble packages → publish (serialized: crates → npm → pub).
# Prerequisites before tagging:
#   1. cargo install cargo-edit   # one-time local install
#   2. cargo set-version --workspace <ver>   # bumps all Cargo.toml versions at once
#   3. git commit -am "chore: release <ver>"
#   4. git tag v<ver> && git push --tags
# Required secrets: CARGO_REGISTRY_TOKEN, NPM_TOKEN, PUB_CREDENTIALS (JSON).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # ── Stage 1: Verify ────────────────────────────────────────────────────────
  verify:
    name: Verify (tests · fmt · version check)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Extract semver from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      # Fail fast: Cargo.toml version must already match the tag.
      # Fix: cargo set-version --workspace <ver>, commit, then re-tag.
      - name: Assert Cargo workspace version matches tag
        run: |
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "el-core") | .version')
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VER" != "$TAG_VER" ]; then
            echo "ERROR: Cargo workspace version ($CARGO_VER) != tag ($TAG_VER)"
            echo "Run: cargo set-version --workspace $TAG_VER"
            echo "Then commit, and push a corrected tag."
            exit 1
          fi

      # All internal dep version requirements live exclusively in [workspace.dependencies].
      # Verify every one of them matches the tag before touching any registry.
      - name: Assert all internal dep versions match tag
        env:
          TAG_VER: ${{ steps.tag.outputs.version }}
        run: |
          python3 << 'PYEOF'
          import re, os, sys
          tag = os.environ['TAG_VER']
          with open('Cargo.toml') as f:
              text = f.read()
          m = re.search(r'\[workspace\.dependencies\](.*?)(?=\n\[|\Z)', text, re.DOTALL)
          if not m:
              sys.exit('ERROR: [workspace.dependencies] section not found in Cargo.toml')
          found = re.findall(r'version\s*=\s*"([^"]+)"', m.group(1))
          bad = [v for v in found if v != tag]
          if bad:
              print(f'ERROR: workspace.dependencies has stale version(s) {bad!r}, expected {tag!r}')
              print(f'Fix: cargo set-version --workspace {tag}')
              sys.exit(1)
          print(f'OK: all {len(found)} internal dep versions in [workspace.dependencies] = "{tag}"')
          PYEOF

      - name: cargo test --locked --workspace
        run: cargo test --locked --workspace

      - name: Assert crates.io packages ship README.md
        run: bash scripts/assert-release-readmes.sh cargo

      - name: Test cargo tool installer
        run: bash tests/test-install-cargo-tool.sh

      - name: Test command retry wrapper
        run: bash tests/test-retry-command.sh

      - name: Check CI workflow tool dependencies
        run: python3 tests/check_ci_workflows.py

      - name: cargo fmt --check
        run: cargo fmt --check

  # ── Stage 2: Build artefacts ───────────────────────────────────────────────

  build-android:
    name: Build Android (armv7 + arm64 + x64) + RN codegen
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
      - name: Cross-compile el-ffi → armv7-linux-androideabi
        env:
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_armv7_linux_androideabi: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          AR_armv7_linux_androideabi: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_armv7_linux_androideabi: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --target armv7-linux-androideabi --release
      - name: Cross-compile el-ffi → aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --target aarch64-linux-android --release
      - name: Cross-compile el-ffi → x86_64-linux-android
        env:
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_AR: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_x86_64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          AR_x86_64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_x86_64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --target x86_64-linux-android --release
      - name: Verify Android 16 KB page alignment
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          python3 scripts/verify-android-page-alignment.py \
            "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            target/aarch64-linux-android/release/libel_ffi.so \
            target/x86_64-linux-android/release/libel_ffi.so
      - name: Install uniffi-bindgen-react-native
        run: npm install --global uniffi-bindgen-react-native@0.31.0-3
      - name: Codegen — React Native (TypeScript + JSI)
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: bash scripts/retry-command.sh make codegen-rn
      - name: Upload RN bindings (TypeScript + JSI)
        uses: actions/upload-artifact@v4
        with:
          name: rn-bindings
          path: out/rn/
      - name: Stage Android native libraries
        run: |
          mkdir -p out/android-libs/armeabi-v7a out/android-libs/arm64-v8a out/android-libs/x86_64
          cp target/armv7-linux-androideabi/release/libel_ffi.so out/android-libs/armeabi-v7a/libel_ffi.so
          cp target/aarch64-linux-android/release/libel_ffi.so out/android-libs/arm64-v8a/libel_ffi.so
          cp target/x86_64-linux-android/release/libel_ffi.so out/android-libs/x86_64/libel_ffi.so
      - name: Upload Android native libraries
        uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: out/android-libs/
          if-no-files-found: error

  build-ios:
    name: Build iOS (device + simulator)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build el-ffi iOS XCFramework
        run: bash scripts/build-ios-xcframework.sh
      - name: Stage iOS XCFramework
        run: |
          mkdir -p target/ios-artifact
          cp -R target/ios-xcframework/el_ffi.xcframework target/ios-artifact/el_ffi.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: ios-lib
          path: target/aarch64-apple-ios/release/libel_ffi.a
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcframework
          path: target/ios-artifact/
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux desktop (x64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build el-ffi → x86_64-unknown-linux-gnu
        run: cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-lib
          path: target/release/libel_ffi.so
          if-no-files-found: error

  build-macos-universal:
    name: Build macOS desktop (universal)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build el-ffi → macOS universal dylib
        run: |
          cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --target x86_64-apple-darwin --release
          cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --target aarch64-apple-darwin --release
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/libel_ffi.dylib \
            target/aarch64-apple-darwin/release/libel_ffi.dylib \
            -output target/universal-apple-darwin/release/libel_ffi.dylib
          lipo -info target/universal-apple-darwin/release/libel_ffi.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-lib
          path: target/universal-apple-darwin/release/libel_ffi.dylib
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows desktop (x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build el-ffi → x86_64-pc-windows-msvc
        run: cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-lib
          path: target/release/el_ffi.dll
          if-no-files-found: error

  build-wasm:
    name: Build WASM (web surface)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          archive="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          bash scripts/retry-command.sh curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/${archive}" \
            -o "${tmp}/${archive}"
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          sudo install -m 0755 \
            "${tmp}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            /usr/local/bin/wasm-pack
          wasm-pack --version
      - name: Build WASM ESM package
        run: make build-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-output
          path: out/web/
          if-no-files-found: error

  build-dart:
    name: Dart codegen
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      FRB_CODEGEN_VERSION: 2.12.0
      CARGO_EXPAND_VERSION: 1.0.123
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dart codegen cargo tools
        run: |
          bash scripts/install-cargo-tool.sh flutter_rust_bridge_codegen flutter_rust_bridge_codegen "$FRB_CODEGEN_VERSION"
          bash scripts/install-cargo-tool.sh cargo-expand cargo-expand "$CARGO_EXPAND_VERSION"
      - name: Codegen — Dart
        run: make codegen-dart
      - name: Assert Dart FRB Rust glue is committed
        run: |
          git ls-files --error-unmatch crates/adapters/el-ffi/src/frb_generated.rs
          git diff --exit-code -- crates/adapters/el-ffi/src/frb_generated.rs
      - name: Resolve Flutter plugin dependencies
        run: flutter pub get --no-example
        working-directory: out/dart
      - name: Stamp pub.dev version from tag
        run: |
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          printf '# Changelog\n\n## %s\n\n- Release %s.\n' "$VERSION" "$VERSION" > CHANGELOG.md
        working-directory: out/dart
      - uses: actions/upload-artifact@v4
        with:
          name: dart-bindings
          path: out/dart/
          if-no-files-found: error

  verify-flutter-ios:
    name: Verify Flutter iOS package
    needs: [build-dart, build-ios]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dart-bindings
          path: assembly/
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcframework
          path: assembly/ios/Frameworks/
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter example dependencies
        run: flutter pub get
        working-directory: assembly/example/
      - name: Run Flutter iOS package smoke build
        run: flutter build ios --simulator --debug
        working-directory: assembly/example/

  # ── Stage 2b: Assemble distribution packages ──────────────────────────────
  # Both assembly jobs wait for the native build jobs so each package contains
  # real native libraries alongside the generated language bindings.

  assemble-npm:
    name: Assemble edge-intelligence-sdk npm package
    needs: [verify, build-android, build-ios, build-wasm]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: wasm-output
          path: assembly/src/web/
      - uses: actions/download-artifact@v4
        with:
          name: rn-bindings
          path: assembly/src/rn/
      - uses: actions/download-artifact@v4
        with:
          name: android-libs
          path: assembly/android/jniLibs/
      - uses: actions/download-artifact@v4
        with:
          name: ios-lib
          path: assembly/ios/
      - name: Write package.json
        run: |
          jq -n \
            --arg name "edge-intelligence-sdk" \
            --arg version "$VERSION" \
            --arg desc "Edge-native LLM inference SDK — Web (WASM) + React Native" \
            '{
              name: $name,
              version: $version,
              description: $desc,
              exports: {
                ".": {
                  browser: "./src/web/el_ffi.js",
                  "react-native": "./src/rn/el_ffi.ts"
                }
               },
               types: "./src/web/el_ffi.d.ts",
               files: ["src/", "android/", "ios/", "README.md"],
               license: "Apache-2.0"
             }' > assembly/package.json
      - name: Copy README.md
        run: cp packaging/npm/README.md assembly/README.md
      - name: Assert npm package ships README.md
        run: bash scripts/assert-release-readmes.sh npm assembly
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: assembly/

  assemble-dart:
    name: Assemble edge_intelligence pub.dev package
    needs:
      [
        verify,
        build-linux-x64,
        build-macos-universal,
        build-windows-x64,
        build-dart,
        build-android,
        build-ios,
        verify-flutter-ios,
      ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dart-bindings
          path: assembly/
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64-lib
          path: native-artifacts/linux/x64/
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal-lib
          path: native-artifacts/macos/
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-lib
          path: native-artifacts/windows/x64/
      - uses: actions/download-artifact@v4
        with:
          name: android-libs
          path: native-artifacts/android/
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcframework
          path: native-artifacts/ios/
      - name: Copy Dart package native runtime artifacts
        run: |
          mkdir -p assembly/lib/native/linux/x64
          mkdir -p assembly/lib/native/macos
          mkdir -p assembly/lib/native/windows/x64
          mkdir -p assembly/android/src/main/jniLibs/armeabi-v7a
          mkdir -p assembly/android/src/main/jniLibs/arm64-v8a
          mkdir -p assembly/android/src/main/jniLibs/x86_64
          mkdir -p assembly/ios/Frameworks
          cp native-artifacts/linux/x64/libel_ffi.so assembly/lib/native/linux/x64/libel_ffi.so
          cp native-artifacts/macos/libel_ffi.dylib assembly/lib/native/macos/libel_ffi.dylib
          cp native-artifacts/windows/x64/el_ffi.dll assembly/lib/native/windows/x64/el_ffi.dll
          cp native-artifacts/android/armeabi-v7a/libel_ffi.so assembly/android/src/main/jniLibs/armeabi-v7a/libel_ffi.so
          cp native-artifacts/android/arm64-v8a/libel_ffi.so assembly/android/src/main/jniLibs/arm64-v8a/libel_ffi.so
          cp native-artifacts/android/x86_64/libel_ffi.so assembly/android/src/main/jniLibs/x86_64/libel_ffi.so
          cp -R native-artifacts/ios/el_ffi.xcframework assembly/ios/Frameworks/el_ffi.xcframework
      - name: Assert native library artifacts are non-empty
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          MIN_BYTES = 10 * 1024  # A real shared library is always larger than 10 KiB
          artifacts = [
              "assembly/lib/native/linux/x64/libel_ffi.so",
              "assembly/lib/native/macos/libel_ffi.dylib",
              "assembly/lib/native/windows/x64/el_ffi.dll",
              "assembly/android/src/main/jniLibs/armeabi-v7a/libel_ffi.so",
              "assembly/android/src/main/jniLibs/arm64-v8a/libel_ffi.so",
              "assembly/android/src/main/jniLibs/x86_64/libel_ffi.so",
          ]
          errors = []
          for path_str in artifacts:
              p = Path(path_str)
              size = p.stat().st_size
              print(f"{p.name}: {size} bytes")
              if size < MIN_BYTES:
                  errors.append(f"{p}: {size} bytes (expected >= {MIN_BYTES}; empty or corrupt artifact?)")
          if errors:
              raise SystemExit("\n".join(["Native library size check failed:"] + errors))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Assert pub.dev package includes README.md
        run: bash scripts/assert-release-readmes.sh pub assembly
      - name: Check pub.dev package size
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # pub.dev enforces a ~100 MB compressed archive limit.
          # Native binaries compress poorly, so guard at 100 MiB uncompressed
          # to catch obviously oversized packages before the dry-run publish.
          max_uncompressed_bytes = 100 * 1024 * 1024
          total = sum(path.stat().st_size for path in Path(".").rglob("*") if path.is_file())
          print(f"pub.dev package uncompressed size: {total} bytes")
          if total > max_uncompressed_bytes:
              raise SystemExit(
                  "pub.dev package exceeds 100 MiB uncompressed (pub.dev cap is "
                  "~100 MB compressed; native binaries compress poorly); split "
                  "runtime artifacts or exclude unnecessary files"
              )
          PY
        working-directory: assembly/
      - name: Resolve Flutter plugin dependencies
        run: flutter pub get --no-example
        working-directory: assembly/
      - name: Run Dart package runtime smoke tests
        run: |
          dart test test/packaged_runtime_smoke_test.dart
          mv lib/native/linux/x64/libel_ffi.so lib/native/linux/x64/libel_ffi.so.missing
          trap 'mv lib/native/linux/x64/libel_ffi.so.missing lib/native/linux/x64/libel_ffi.so' EXIT
          dart test test/missing_runtime_test.dart
        working-directory: assembly/
      - name: Run Flutter example tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
        working-directory: assembly/example/
      - name: Run Flutter Android package smoke build
        run: |
          flutter build apk --debug --target-platform android-arm,android-arm64,android-x64
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/armeabi-v7a/libel_ffi.so'
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/arm64-v8a/libel_ffi.so'
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/x86_64/libel_ffi.so'
        working-directory: assembly/example/
      - name: flutter pub publish --dry-run (validation gate)
        run: flutter pub publish --dry-run
        working-directory: assembly/
      - uses: actions/upload-artifact@v4
        with:
          name: pub-package
          path: assembly/

  # ── Stage 3: Publish (serialized: crates → npm → pub) ─────────────────────
  # crates.io is immutable, so it must be the LAST thing validated before the
  # first publish — gate it on BOTH assembly jobs (which include the pub.dev
  # dry-run and npm package assembly). Each registry then gates on the previous
  # one: if crates fails, npm and pub are not touched; if npm fails, pub is not.
  # publish-crates → assemble-{npm,dart} transitively covers all build jobs.

  publish-crates:
    name: Publish → crates.io
    needs: [verify, assemble-npm, assemble-dart]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # --no-verify: tests already passed in Stage 1.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh

  publish-npm:
    name: Publish → npmjs.com
    needs: [publish-crates, assemble-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Assert npm package artifact ships README.md
        run: |
          test -s npm-package/README.md
          npm pack npm-package/ --dry-run --json | grep -Eq '"path": ?"README\.md"'
      - name: Publish edge-intelligence-sdk
        run: npm publish npm-package/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pub:
    name: Publish → pub.dev
    needs: [publish-npm, assemble-dart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pub-package
          path: pub-package/
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Assert pub.dev package artifact includes README.md
        run: test -s pub-package/README.md
      - name: Configure pub.dev credentials
        run: |
          mkdir -p ~/.config/dart
          echo '${{ secrets.PUB_CREDENTIALS }}' > ~/.config/dart/pub-credentials.json
      - name: Publish edge_intelligence
        run: flutter pub publish --force
        working-directory: pub-package/
