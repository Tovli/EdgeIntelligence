name: Bindings & Mobile Cross-Compile

on:
  push:
    branches: [master]
    paths:
      - 'crates/adapters/el-ffi/**'
      - 'crates/el-core/**'
      - 'crates/el-runtime/**'
      - 'crates/adapters/el-engine-candle/**'
      - 'packaging/dart/**'
      - 'packaging/npm/**'
      - '.cargo/config.toml'
      - 'Makefile'
      - 'scripts/build-ios-xcframework.sh'
      - 'scripts/verify-android-page-alignment.py'
      - 'scripts/install-cargo-tool.sh'
      - 'scripts/retry-command.sh'
      - 'tests/check_ci_workflows.py'
      - 'tests/test_dart_package_contract.py'
      - 'tests/test_react_native_package_contract.py'
      - 'tests/test-install-cargo-tool.sh'
      - 'tests/test-retry-command.sh'
      - '.github/workflows/bindings.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'crates/adapters/el-ffi/**'
      - 'crates/el-core/**'
      - 'crates/el-runtime/**'
      - 'crates/adapters/el-engine-candle/**'
      - 'packaging/dart/**'
      - 'packaging/npm/**'
      - '.cargo/config.toml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'Makefile'
      - 'scripts/build-ios-xcframework.sh'
      - 'scripts/verify-android-page-alignment.py'
      - 'scripts/install-cargo-tool.sh'
      - 'scripts/retry-command.sh'
      - 'tests/check_ci_workflows.py'
      - 'tests/test_dart_package_contract.py'
      - 'tests/test_react_native_package_contract.py'
      - 'tests/test-install-cargo-tool.sh'
      - 'tests/test-retry-command.sh'
      - '.github/workflows/bindings.yml'
      - '.github/workflows/release.yml'

jobs:
  # ── Host: compile + test el-ffi on the native target ─────────────────────
  host:
    name: Host compile & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test el-ffi (host target)
        run: cargo test -p el-ffi
      - name: Test cargo tool installer
        run: bash tests/test-install-cargo-tool.sh
      - name: Test command retry wrapper
        run: bash tests/test-retry-command.sh
      - name: Check CI workflow tool dependencies
        run: python3 tests/check_ci_workflows.py
      - name: Check Dart package contract
        run: python3 tests/test_dart_package_contract.py
      - name: Check React Native package contract
        run: python3 tests/test_react_native_package_contract.py

  # ── Android: aarch64-linux-android cross-compile ──────────────────────────
  android:
    name: Android armv7 + arm64 + x64 cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
      - name: Cross-compile el-ffi → armv7-linux-androideabi
        env:
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_armv7_linux_androideabi: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          AR_armv7_linux_androideabi: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_armv7_linux_androideabi: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --target armv7-linux-androideabi --release
      - name: Cross-compile el-ffi → aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --target aarch64-linux-android --release

      - name: Cross-compile el-ffi → x86_64-linux-android
        env:
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          CARGO_TARGET_X86_64_LINUX_ANDROID_AR: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_x86_64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          AR_x86_64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_x86_64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: cargo build --manifest-path crates/adapters/el-ffi/Cargo.toml --target x86_64-linux-android --release
      - name: Verify Android 16 KB page alignment
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          python3 scripts/verify-android-page-alignment.py \
            "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            target/aarch64-linux-android/release/libel_ffi.so \
            target/x86_64-linux-android/release/libel_ffi.so

      - name: Install uniffi-bindgen-react-native
        run: >-
          bash scripts/retry-command.sh npm install --global
          uniffi-bindgen-react-native@0.31.0-3
      - name: Codegen — React Native (TypeScript + JSI)
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CARGO_TARGET_AARCH64_LINUX_ANDROID_AR: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CC_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_aarch64_linux_android: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: bash scripts/retry-command.sh make codegen-rn
      - name: Assemble React Native package for Android smoke
        run: |
          mkdir -p assembly/src/rn assembly/android/src/main/jniLibs/armeabi-v7a
          mkdir -p assembly/android/src/main/jniLibs/arm64-v8a
          mkdir -p assembly/android/src/main/jniLibs/x86_64
          cp -R packaging/npm/. assembly/
          cp -R out/rn/. assembly/src/rn/
          cp target/armv7-linux-androideabi/release/libel_ffi.so \
            assembly/android/src/main/jniLibs/armeabi-v7a/libel_ffi.so
          cp target/aarch64-linux-android/release/libel_ffi.so \
            assembly/android/src/main/jniLibs/arm64-v8a/libel_ffi.so
          cp target/x86_64-linux-android/release/libel_ffi.so \
            assembly/android/src/main/jniLibs/x86_64/libel_ffi.so
          (
            cd assembly
            uniffi-bindgen-react-native generate jsi turbo-module el_ffi \
              --native-bindings --config ubrn.config.yaml
            python3 ../scripts/patch-ubrn-cmake.py android/CMakeLists.txt
          )
      - name: Run React Native package type check
        working-directory: assembly
        run: |
          trap 'rm -rf node_modules' EXIT
          bash ../scripts/retry-command.sh npm install --ignore-scripts --package-lock=false
          npx tsc --noEmit --project tsconfig.rn.json
      - name: Run Expo Android native build smoke
        working-directory: assembly/example-expo
        run: |
          # A packed install places the UBRN runtime where CMake resolves it:
          # node_modules/edge-intelligence-sdk/android -> ../../node_modules.
          # A file:.. fixture instead leaves CMake in the sibling assembly tree.
          tarball="$(npm pack .. --pack-destination . --silent)"
          npm pkg set "dependencies.edge-intelligence-sdk=file:./$tarball"
          bash ../../scripts/retry-command.sh npm install --package-lock-only --ignore-scripts
          bash ../../scripts/retry-command.sh npm ci
          npx expo prebuild --platform android --no-install
          (cd android && ./gradlew :app:assembleRelease)
          grep -R "edge-intelligence-sdk" android/build/generated/autolinking
          grep -R "build/generated/source/codegen/jni/CMakeLists.txt" \
            android/build/generated/autolinking
          unzip -l android/app/build/outputs/apk/release/app-release.apk \
            | grep -F "lib/arm64-v8a/libel_ffi.so"
          unzip -l android/app/build/outputs/apk/release/app-release.apk \
            | grep -F "lib/x86_64/libel_ffi.so"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: rn-bindings
          path: out/rn/

  # ── iOS: aarch64-apple-ios cross-compile ──────────────────────────────────
  ios:
    name: iOS device + simulator XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build el-ffi iOS XCFramework
        run: bash scripts/build-ios-xcframework.sh

  # ── Web: wasm32-unknown-unknown + wasm-pack ───────────────────────────────
  wasm:
    name: Web (wasm32 + wasm-bindgen codegen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: v0.15.0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          archive="wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          bash scripts/retry-command.sh curl -fsSL \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/${WASM_PACK_VERSION}/${archive}" \
            -o "${tmp}/${archive}"
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          sudo install -m 0755 \
            "${tmp}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            /usr/local/bin/wasm-pack
          wasm-pack --version
      - name: Build WASM ESM package
        run: make build-wasm
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: web-bindings
          path: out/web/

  # ── Dart binding codegen ─────────────────────────────────────────────────
  dart:
    name: Dart codegen
    runs-on: ubuntu-latest
    env:
      FRB_CODEGEN_VERSION: 2.12.0
      CARGO_EXPAND_VERSION: 1.0.123
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: dart-lang/setup-dart@v1
      - name: Install Dart codegen cargo tools
        run: |
          bash scripts/install-cargo-tool.sh flutter_rust_bridge_codegen flutter_rust_bridge_codegen "$FRB_CODEGEN_VERSION"
          bash scripts/install-cargo-tool.sh cargo-expand cargo-expand "$CARGO_EXPAND_VERSION"
      - name: Codegen — Dart
        run: make codegen-dart
      - name: Assert Dart FRB Rust glue is committed
        run: |
          git ls-files --error-unmatch crates/adapters/el-ffi/src/frb_generated.rs
          git diff --exit-code -- crates/adapters/el-ffi/src/frb_generated.rs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dart-bindings
          path: out/dart/
          include-hidden-files: true
