// Workaround for UBRN 0.31, crates/ubrn_cli/src/jsi/android/codegen.rs:32-40.
// It selects Java output only while this file lacks a language-name trigger.
// Keep that token out unless generated paths and release checks move to .kt.
def safeExtGet(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

android {
  namespace "com.edgeintelligence"
  ndkVersion safeExtGet("ndkVersion", "28.2.13676358")
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    consumerProguardFiles "consumer-rules.pro"

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
      }
    }

    ndk {
      abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main {
      java.srcDirs += ["${buildDir}/generated/source/codegen/java"]
    }
  }
}

react {
  jsRootDir = file("../src/")
  libraryName = "EdgeIntelligenceSdk"
  codegenJavaPackageName = "com.edgeintelligence"
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "net.java.dev.jna:jna:5.17.0@aar"
}
